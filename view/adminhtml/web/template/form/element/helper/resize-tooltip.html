<div class="admin__field-tooltip fom-image-resize-tooltip">
    <a class="admin__field-tooltip-action action-help" tabindex="1">
        <span translate="'What is this?'"></span>
    </a>
    <div class="admin__field-tooltip-content">
        <img class="fom-image-resize-tooltip-image" attr="src: tooltip.imageUrl, alt: tooltip.description"/>
        <p class="fom-image-resize-tooltip-text" text="tooltip.description"></p>
    </div>
</div>
